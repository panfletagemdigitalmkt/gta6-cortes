name: Cortes GTA 6

on:
  schedule:
    - cron: "17 */3 * * *"   # a cada 3 horas (horário UTC)
  workflow_dispatch:          # botão "Run workflow" para rodar na mão
    inputs:
      modo:
        description: "listar = só mostra os clipes encontrados · rodar = gera os vídeos"
        type: choice
        options: ["rodar", "listar"]
        default: "rodar"
      quantidade:
        description: "Quantos cortes gerar nesta rodada (vazio = valor do config.yaml)"
        type: string
        default: ""
      postar:
        description: "Postar de verdade? (false = só gera os vídeos)"
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: write             # para salvar data/postados.json

concurrency:
  group: cortes
  cancel-in-progress: false

jobs:
  cortes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg e fontes
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-montserrat

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Cache do modelo de legenda (Whisper)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}
          restore-keys: whisper-

      - name: Buscar, cortar e postar
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # agendado: usa a variável POSTAR do repositório; manual: usa o botão
          POSTAR: ${{ github.event_name == 'workflow_dispatch' && inputs.postar || vars.POSTAR }}
          QUANTIDADE: ${{ inputs.quantidade }}
        run: |
          if [ "${{ inputs.modo }}" = "listar" ]; then
            python -m gta6_cortes.main --listar
          else
            python -m gta6_cortes.main
          fi

      - name: Guardar vídeos gerados (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortes-${{ github.run_number }}
          path: saida/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Salvar histórico de postados
        if: always()
        run: |
          git config user.name "gta6-cortes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/postados.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza histórico de cortes [skip ci]"
          git push
